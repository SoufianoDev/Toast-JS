name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browserstack_ios:
        description: Run real iOS Safari test via BrowserStack
        type: boolean
        default: false

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/regression/issue10/verify-issue10.js
        name: Issue #10 - Video icon playsInline (Chromium)

  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: node tests/regression/issue10/verify-issue10-webkit.js
        name: Issue #10 - Video icon playsInline (WebKit/Safari)

  browserstack-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.browserstack_ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start BrowserStack Local
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-identifier: random
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      - run: node tests/regression/issue10/browserstack-ios.js
        name: Run iOS Safari test via BrowserStack
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      - name: Stop BrowserStack Local
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop
