<!DOCTYPE html>
<html>
<head><title>Issue #10 - Video icon playsInline on iOS Safari</title></head>
<body>
<script src="/dist/toast.umd.js"></script>
<script>
(function() {
  var results = {};
  var passed = 0;
  var failed = 0;

  function assert(desc, ok) {
    results[desc] = ok;
    if (ok) { passed++; console.log('  PASS:', desc); }
    else    { failed++; console.log('  FAIL:', desc); }
  }

  var toast = Toast.makeText(document.body, "Video icon test", Toast.LENGTH_SHORT);
  toast.setIcon("https://example.com/icon.webm");
  toast.show();

  var videoEl = document.querySelector('video');
  if (videoEl) {
    assert("video element exists", true);
    assert("playsInline is true", videoEl.playsInline === true);
    assert("autoplay is true", videoEl.autoplay === true);
    assert("loop is true", videoEl.loop === true);
    assert("muted is true", videoEl.muted === true);
    assert("playbackRate is 1.0", videoEl.playbackRate === 1.0);
  } else {
    assert("video element found in DOM", false);
  }

  toast.hide();

  window.__testResults = { results: results, passed: passed, failed: failed };
  console.log('[ISSUE10] Results:', JSON.stringify(window.__testResults));
})();
</script>
</body>
</html>
